name: PHPMD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  phpmd:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpmd

      - name: Check PHPMD Version
        run: phpmd --version

      - name: Run PHPMD
        run: |
          phpmd analyze \
            --format github \
            --ruleset phpmd.xml \
            --exclude 'vendor/*,tests/*' \
            .