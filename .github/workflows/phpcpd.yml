name: phpcpd

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  phpcpd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpcpd

      - name: Run PHPCPD
        run: |
          mkdir -p build/reports
          phpcpd --min-lines 5 --min-tokens 70 --exclude vendor --exclude tests --log-pmd build/reports/cpd-report.xml .

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpd-reports
          path: build/reports/